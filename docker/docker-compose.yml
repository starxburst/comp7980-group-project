services:
  mongodb:
    image: mongo:7
    container_name: petstagram-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: petstagram-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: petstagram
      MINIO_ROOT_PASSWORD: petstagram123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  server:
    image: node:20
    container_name: petstagram-server
    working_dir: /workspace
    command: sh -c "npm install && npm run dev:server"
    env_file:
      - ../.env
    environment:
      PORT: ${PORT:-5001}
      MONGODB_URI: mongodb://mongodb:27017/petstagram
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      CLIENT_URL: http://localhost:${WEB_PORT:-3000}
      VITE_API_BASE_URL: http://localhost:${PORT:-5001}/api
    volumes:
      - ..:/workspace
      - server_node_modules:/workspace/node_modules
    ports:
      - "${PORT:-5001}:${PORT:-5001}"
    depends_on:
      - mongodb
      - minio
    restart: unless-stopped

  web:
    image: node:20
    container_name: petstagram-web
    working_dir: /workspace
    command: sh -c "npm install && cd apps/web && npm run dev"
    env_file:
      - ../.env
    environment:
      CLIENT_URL: http://localhost:${WEB_PORT:-3000}
      VITE_API_BASE_URL: http://localhost:${PORT:-5001}/api
    volumes:
      - ..:/workspace
      - web_node_modules:/workspace/node_modules
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - server
    restart: unless-stopped

  mobile:
    image: node:20
    container_name: petstagram-mobile
    working_dir: /workspace
    command: sh -c "npm install && cd apps/mobile && npm run dev"
    env_file:
      - ../.env
    environment:
      VITE_API_BASE_URL: http://localhost:${PORT:-5001}/api
    volumes:
      - ..:/workspace
      - mobile_node_modules:/workspace/node_modules
    ports:
      - "${MOBILE_PORT:-8100}:8100"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo_data:
  minio_data:
  server_node_modules:
  web_node_modules:
  mobile_node_modules:
